name: publish to GitHub Pages
# Publishes the game at https://<user>.github.io/<repo>/ on every push to main.
# One time: Settings > Pages > Source: GitHub Actions. (Pages on a private repo needs a paid GitHub plan.)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: node tools/package.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/mivtza-midbar-1973 }
      - id: d
        uses: actions/deploy-pages@v4
